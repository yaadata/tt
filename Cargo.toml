[package]
name = "testing-tools"
version = "0.0.1"
edition = "2024"
rust-version = "1.96.0"
description = "A set of tools to ease testing across different languages and frameworks using neovim."
repository = "https://github.com/Ydot19/examen-tools"
license = "MIT"
keywords = ["neovim", "plugin", "development-tools", "testing"]

[lib]
crate-type = ["cdylib"]
name = "examen"
path = "./lib/lib.rs"

[dependencies]
mlua = { version = "0.10.2", features = ["luajit", "vendored"] }
bon = "3.7.2"
thiserror = { version = "2.0.10" }
regex = { version = "1.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.26"
tree-sitter-go = "0.25"

[dev-dependencies]
googletest = "0.14.3"
rstest = "0.26.1"
mockall = "0.14.0"

[workspace]
members = ["scripts/repo-tools"]
