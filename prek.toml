default_install_hook_types = ["commit-msg", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "conventional-pre-commit"
name = "Conventional Commit"
entry = "python scripts/commit_msg.py"
language = "python"
additional_dependencies = ["conventional-pre-commit==4.4.0"]
stages = ["commit-msg"]

[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
entry = "mise exec -- cargo test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
